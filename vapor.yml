id: 63117
name: Learnlab-Serverless-API
environments:
  beta:
    domain: 'api.beta.learnlab.ai'
    database: Learnlab-Serverless-Beta
    runtime: docker
    memory: 4096
    storage: learnlab-serverless-beta
    warm: 4
    concurrency: 50
    # queue-timeout: 10
    queues: false
    #   - default
    #   - chat
    timeout: 600
    cli-timeout: 900
    build:
      - "composer install --ignore-platform-reqs"
      - "php artisan event:cache"
    firewall:
      rate-limit: 1000
      bot-control:
      #     - CategorySearchEngine
      #     - CategorySocialMedia
          - CategoryScrapingFramework
          - CategoryAdvertising
          - CategoryArchiver
      #     - SignalNonBrowserUserAgent
      #     - CategoryHttpLibrary
          - CategoryLinkChecker
      #     - CategoryMiscellaneous
          - SignalKnownBotDataCenter
